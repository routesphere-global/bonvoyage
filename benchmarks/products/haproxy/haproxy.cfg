global
  maxconn 32768
  stats timeout 30s
  tune.bufsize 32768

defaults
  mode http
  timeout connect 1s
  timeout client 60s
  timeout server 15s
  timeout http-request 15s
  timeout http-keep-alive 60s
  option http-keep-alive

frontend http
  bind *:8080
  default_backend controlled_upstream

frontend admin
  bind 127.0.0.1:9901
  http-request return status 200 content-type text/plain lf-string "ready\n" if { path /health/ready }
  http-request return status 404

backend controlled_upstream
  http-reuse safe
  server upstream 127.0.0.1:8081 maxconn 256
