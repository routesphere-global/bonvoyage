user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
  worker_connections 65535;
  multi_accept on;
}

http {
  access_log off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  keepalive_requests 1000000;

  server {
    listen 8081 reuseport;
    server_name _;
    root /srv;

    location = /healthz {
      default_type text/plain;
      try_files $uri =404;
    }

    location = /payload/256 {
      default_type application/octet-stream;
      try_files $uri =404;
    }

    location = /payload/8192 {
      default_type application/octet-stream;
      try_files $uri =404;
    }

    location = /payload/15360 {
      default_type application/octet-stream;
      try_files $uri =404;
    }

    location = /payload/16384 {
      default_type application/octet-stream;
      try_files $uri =404;
    }

    location = /payload/17408 {
      default_type application/octet-stream;
      try_files $uri =404;
    }

    location = /payload/32768 {
      default_type application/octet-stream;
      try_files $uri =404;
    }

    location = /payload/65536 {
      default_type application/octet-stream;
      try_files $uri =404;
    }

    location = /payload/1048576 {
      default_type application/octet-stream;
      try_files $uri =404;
    }

    location = /policy/payload/256 {
      alias /srv/payload/256;
      default_type application/octet-stream;
      add_header x-upstream-policy-set upstream-set always;
      add_header x-upstream-policy-append upstream-append always;
      add_header x-upstream-policy-remove upstream-remove always;
      add_header x-observed-request-set $http_x_policy_set always;
      add_header x-observed-request-append $http_x_policy_append always;
      add_header x-observed-request-remove $http_x_policy_remove always;
      add_header x-observed-request-added $http_x_policy_added always;
    }

    location = /policy/payload/8192 {
      alias /srv/payload/8192;
      default_type application/octet-stream;
      add_header x-upstream-policy-set upstream-set always;
      add_header x-upstream-policy-append upstream-append always;
      add_header x-upstream-policy-remove upstream-remove always;
      add_header x-observed-request-set $http_x_policy_set always;
      add_header x-observed-request-append $http_x_policy_append always;
      add_header x-observed-request-remove $http_x_policy_remove always;
      add_header x-observed-request-added $http_x_policy_added always;
    }

    location / {
      return 404;
    }
  }
}
