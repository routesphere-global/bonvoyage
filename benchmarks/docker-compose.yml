services:
  upstream:
    build:
      context: ./products/upstream
    image: bonvoyage-benchmark-upstream:dev
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8081/healthz"]
      interval: 2s
      timeout: 1s
      retries: 20

  snapshot-compiler:
    build:
      context: ..
      dockerfile: deploy/docker/control-plane/Dockerfile
    command:
      - -input
      - /etc/bonvoyage/local.yaml
      - -output
      - /var/lib/bonvoyage/snapshot.pb
    volumes:
      - ../config/examples/local.yaml:/etc/bonvoyage/local.yaml:ro
      - benchmark-snapshot:/var/lib/bonvoyage

  bonvoyage:
    build:
      context: ..
      dockerfile: deploy/docker/bonvoyage/Dockerfile
    command:
      - --snapshot
      - /etc/bonvoyage/snapshot.pb
      - --admin-address
      - 0.0.0.0
      - --metrics-address
      - 0.0.0.0
      - --smp
      - "1"
      - --memory
      - 256M
      - --overprovisioned
    volumes:
      - benchmark-snapshot:/etc/bonvoyage:ro
    ports:
      - "8080:8080"
    depends_on:
      upstream:
        condition: service_healthy
      snapshot-compiler:
        condition: service_completed_successfully

  envoy:
    image: envoyproxy/envoy:v1.31-latest
    profiles: ["competitors"]
    volumes:
      - ./products/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "10000:10000"
    depends_on:
      - upstream

  nginx:
    image: nginx:1.27-alpine
    profiles: ["competitors"]
    volumes:
      - ./products/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "10080:10080"
    depends_on:
      - upstream

  haproxy:
    image: haproxy:3.0-alpine
    profiles: ["competitors"]
    volumes:
      - ./products/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "10081:10081"
    depends_on:
      - upstream

volumes:
  benchmark-snapshot:
