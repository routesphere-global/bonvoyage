schema_version: 1
id: http1-keepalive-baseline
description: Plain HTTP/1.1 reverse-proxy baseline with persistent connections.
protocol: http1
request:
  method: GET
  path: /payload/256
  body_bytes: 0
  headers:
    accept: application/octet-stream
response:
  status: 200
  body_bytes: 256
  sha256: 85e62acd750c4eb56b7b6a1d66dca5bfaac5f062608a1a893410d0288936c09a
connection:
  keep_alive: true
  pipeline_depth: 1
  tls_version: none
topology:
  route_count: 1
  endpoint_count: 1
execution:
  warmup_seconds: 30
  measurement_seconds: 60
  repetitions: 5
  gateway_cores: [1, 2]
  load_model: open-loop
  concurrency: [16, 64, 256, 1024]
  utilization_targets: [0.5, 0.7, 0.8, 0.9, 0.95, 1.05]
