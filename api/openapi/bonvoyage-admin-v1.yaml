    RolloutPolicy:
      type: object
      additionalProperties: false
      required:
        - strategy
        - prepare_timeout_seconds
        - activation_timeout_seconds
        - automatic_rollback
      properties:
        enabled:
          type: boolean
          const: true
          readOnly: true
          description: Present as true in responses; request presence enables the policy.
        strategy:
          type: string
          enum: [IMMEDIATE, CANARY]
        canary_node_ids:
          type: array
          minItems: 1
          maxItems: 128
          uniqueItems: true
          items:
            $ref: '#/components/schemas/NodeID'
          description: Required for CANARY and forbidden for IMMEDIATE.
        minimum_healthy_canary_percent:
          type: integer
          minimum: 1
          maximum: 100
          description: Required for CANARY and forbidden for IMMEDIATE.
        canary_observation_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          description: Required for CANARY and forbidden for IMMEDIATE.
        prepare_timeout_seconds:
          type: integer
          minimum: 1
          maximum: 7200
        activation_timeout_seconds:
          type: integer
          minimum: 1
          maximum: 7200
        heartbeat_stale_after_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          description: >-
            Required for CANARY, forbidden for IMMEDIATE, and no greater than
            canary_observation_seconds.
        automatic_rollback:
          type: boolean
          description: >-
            Creates a new exact rollback sequence after every target node has
            reconciled an artifact within the failed/baseline lineage.
