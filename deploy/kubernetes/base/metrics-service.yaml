apiVersion: v1
kind: Service
metadata:
  name: bonvoyage-metrics
  namespace: bonvoyage
  labels:
    app.kubernetes.io/name: bonvoyage
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bonvoyage
    app.kubernetes.io/component: gateway
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
