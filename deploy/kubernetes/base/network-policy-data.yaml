apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bonvoyage-data-ingress
  namespace: bonvoyage
  labels:
    app.kubernetes.io/name: bonvoyage
    app.kubernetes.io/component: gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bonvoyage
      app.kubernetes.io/component: gateway
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8443
