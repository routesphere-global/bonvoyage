apiVersion: apps/v1
kind: Deployment
metadata:
  name: bonvoyage
  namespace: bonvoyage
spec:
  template:
    spec:
      containers:
        - name: dataplane
          ports:
            - name: http
              containerPort: 8080
              $patch: delete
            - name: https
              containerPort: 8443
          volumeMounts:
            - name: downstream-tls
              mountPath: /etc/bonvoyage/secrets
              readOnly: true
      volumes:
        - name: downstream-tls
          secret:
            secretName: bonvoyage-downstream-tls
            defaultMode: 0440
