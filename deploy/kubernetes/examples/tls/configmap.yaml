apiVersion: v1
kind: ConfigMap
metadata:
  name: bonvoyage-config
  namespace: bonvoyage
data:
  local.yaml: |
    server:
      node_id: "bonvoyage-kubernetes-tls"
      admin_addr: "0.0.0.0:9901"
      metrics_addr: "0.0.0.0:9090"
    snapshot:
      schema_version: 1
      snapshot_id: "kubernetes-tls-bootstrap"
      generation: 1
      minimum_dataplane_version: "0.2.0"
    listeners:
      - name: "https"
        address: "0.0.0.0"
        port: 8443
        protocol: "http1"
        virtual_hosts: ["api"]
        downstream_tls:
          certificate_chain_secret: "server-chain.pem"
          private_key_secret: "server-key.pem"
    virtual_hosts:
      - name: "api"
        domains: ["api.example.test"]
        routes:
          - name: "ready"
            match:
              path_exact: "/bonvoyage/ready"
            fixed_response:
              status_code: 200
              body: "ready\n"
              content_type: "text/plain"
          - name: "default"
            match:
              path_prefix: "/"
            cluster: "upstream"
    clusters:
      - name: "upstream"
        load_balancing_policy: "round_robin"
        connect_timeout_ms: 1000
        max_connections_per_shard: 128
        max_pending_requests_per_shard: 256
        endpoints:
          - name: "upstream-1"
            address: "upstream"
            port: 8081
            weight: 1
    runtime_limits:
      max_downstream_connections_per_shard: 16384
      max_request_header_bytes: 32768
      max_request_body_bytes: 10485760
      max_upstream_response_header_bytes: 32768
      max_upstream_chunk_metadata_bytes: 32768
      request_timeout_ms: 15000
      downstream_idle_timeout_ms: 60000
