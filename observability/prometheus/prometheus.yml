global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 15s
  external_labels:
    product: routesphere_bonvoyage
    telemetry_contract: "1"

rule_files:
  - rules/bonvoyage-recording-rules.yml
  - rules/bonvoyage-alerts.yml

scrape_configs:
  - job_name: bonvoyage
    honor_labels: false
    metrics_path: /metrics
    static_configs:
      - targets:
          - bonvoyage:9090
        labels:
          environment: local
          deployment: standalone
