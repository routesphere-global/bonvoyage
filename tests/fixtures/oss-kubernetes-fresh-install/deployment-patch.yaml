apiVersion: apps/v1
kind: Deployment
metadata:
  name: bonvoyage
  namespace: bonvoyage
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    spec:
      volumes:
        - name: config
          configMap:
            name: bonvoyage-config-v1
