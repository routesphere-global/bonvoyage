server:
  node_id: phase5-policy-c01
  admin_addr: 127.0.0.1:9901
  metrics_addr: 127.0.0.1:9090

snapshot:
  schema_version: 1
  snapshot_id: phase5-policy-c01
  generation: 1
  minimum_dataplane_version: 0.2.0

listeners:
  - name: https-http1
    address: 0.0.0.0
    port: 8443
    protocol: http1
    virtual_hosts: [api]
    downstream_tls:
      certificate_chain_secret: server-chain.pem
      private_key_secret: server-key.pem

virtual_hosts:
  - name: api
    domains: [api.example.test]
    routes:
      - name: policy-headers-256
        match:
          path_exact: /policy/payload/256
          methods: [GET]
        header_transformations:
          request:
            - operation: set
              name: x-policy-set
              value: gateway-set
            - operation: append
              name: x-policy-append
              value: gateway-append
            - operation: remove
              name: x-policy-remove
            - operation: set
              name: x-policy-added
              value: gateway-added
          response:
            - operation: set
              name: x-upstream-policy-set
              value: gateway-set
            - operation: append
              name: x-upstream-policy-append
              value: gateway-append
            - operation: remove
              name: x-upstream-policy-remove
            - operation: set
              name: x-policy-response-added
              value: gateway-added
        cluster: upstream

clusters:
  - name: upstream
    load_balancing_policy: round_robin
    connect_timeout_ms: 1000
    max_connections_per_shard: 128
    max_pending_requests_per_shard: 256
    endpoints:
      - name: upstream-a
        address: upstream-a
        port: 8081
        weight: 1
      - name: upstream-b
        address: upstream-b
        port: 8081
        weight: 1

runtime_limits:
  max_downstream_connections_per_shard: 16384
  max_request_header_bytes: 32768
  max_request_body_bytes: 10485760
  max_upstream_response_header_bytes: 32768
  max_upstream_chunk_metadata_bytes: 32768
  request_timeout_ms: 15000
  downstream_idle_timeout_ms: 60000
