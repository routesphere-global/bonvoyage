server:
  node_id: phase3-retry-node
  admin_addr: 0.0.0.0:9901
  metrics_addr: 0.0.0.0:9090

snapshot:
  schema_version: 1
  snapshot_id: phase3-retry-smoke
  generation: 1
  minimum_dataplane_version: 0.2.0

listeners:
  - name: https-http2
    address: 0.0.0.0
    port: 8443
    protocol: http2
    virtual_hosts: [api]
    downstream_tls:
      certificate_chain_secret: server-chain.pem
      private_key_secret: server-key.pem
  - name: cleartext-http1
    address: 0.0.0.0
    port: 8080
    protocol: http1
    virtual_hosts: [api]

virtual_hosts:
  - name: api
    domains: [api.example.test]
    routes:
      - name: retry-upstream
        match:
          path_prefix: /
        cluster: local-upstream

clusters:
  - name: local-upstream
    load_balancing_policy: round_robin
    connect_timeout_ms: 500
    max_connections_per_shard: 8
    max_pending_requests_per_shard: 16
    retry:
      max_attempts: 2
      per_try_timeout_ms: 100
      retryable_methods: [GET, HEAD, OPTIONS, PUT]
      budget:
        capacity: 1
        refill_tokens_per_second: 1
        max_concurrent_retries_per_shard: 1
    endpoints:
      - name: upstream-1
        address: upstream
        port: 8081

runtime_limits:
  max_downstream_connections_per_shard: 256
  max_request_header_bytes: 32768
  max_request_body_bytes: 1048576
  max_upstream_response_header_bytes: 32768
  max_upstream_chunk_metadata_bytes: 32768
  request_timeout_ms: 3000
  downstream_idle_timeout_ms: 30000
