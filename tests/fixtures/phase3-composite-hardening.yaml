server:
  node_id: phase3-composite-hardening
  admin_addr: 0.0.0.0:9901
  metrics_addr: 0.0.0.0:9090

snapshot:
  schema_version: 1
  snapshot_id: phase3-composite-hardening
  generation: 1
  minimum_dataplane_version: 0.2.0

listeners:
  - name: cleartext-http1
    address: 0.0.0.0
    port: 8080
    protocol: http1
    virtual_hosts: [api, websocket-api]
  - name: tls-http2
    address: 0.0.0.0
    port: 8443
    protocol: http2
    virtual_hosts: [api]
    downstream_tls:
      certificate_chain_secret: server-chain.pem
      private_key_secret: server-key.pem

virtual_hosts:
  - name: api
    domains: [api.example.test]
    routes:
      - name: grpc-unary
        match:
          path_prefix: /bonvoyage.test.v1.Echo/
          methods: [POST]
        cluster: grpc-upstream
      - name: route-saturation
        match:
          path_exact: /saturate
          methods: [GET]
        cluster: stable
        max_concurrent_requests_per_shard: 2
        rewrite:
          path: /slow/300
      - name: weighted-release
        match:
          path_exact: /split
          methods: [GET]
        weighted_clusters:
          - {cluster: stable, weight: 3}
          - {cluster: canary, weight: 1}
        rewrite:
          path: /identity
      - name: endpoint-balancing
        match:
          path_exact: /lb
          methods: [GET]
        cluster: load-balanced
        rewrite:
          path: /identity
      - name: readiness-payload
        match:
          path_exact: /ready
          methods: [GET]
        cluster: stable
        rewrite:
          path: /identity
  - name: websocket-api
    domains: [ws.example.test]
    routes:
      - name: websocket-churn
        match:
          path_exact: /socket
          methods: [GET]
        cluster: websocket
        max_concurrent_requests_per_shard: 32
        websocket:
          idle_timeout_ms: 5000
        rewrite:
          path: /echo

clusters:
  - name: stable
    load_balancing_policy: round_robin
    connect_timeout_ms: 500
    max_connections_per_shard: 64
    max_pending_requests_per_shard: 256
    max_concurrent_requests_per_endpoint: 128
    endpoints:
      - name: stable-1
        address: stable
        port: 8081
        weight: 1
  - name: canary
    load_balancing_policy: round_robin
    connect_timeout_ms: 500
    max_connections_per_shard: 64
    max_pending_requests_per_shard: 256
    max_concurrent_requests_per_endpoint: 128
    passive_health:
      consecutive_failures: 1
      ejection_time_ms: 500
      max_ejection_percent: 100
    endpoints:
      - name: canary-1
        address: canary
        port: 8081
        weight: 1
  - name: load-balanced
    load_balancing_policy: round_robin
    connect_timeout_ms: 500
    max_connections_per_shard: 64
    max_pending_requests_per_shard: 256
    max_concurrent_requests_per_endpoint: 128
    passive_health:
      consecutive_failures: 1
      ejection_time_ms: 500
      max_ejection_percent: 50
    endpoints:
      - name: stable-1
        address: stable
        port: 8081
        weight: 1
      - name: canary-1
        address: canary
        port: 8081
        weight: 1
  - name: websocket
    load_balancing_policy: round_robin
    connect_timeout_ms: 500
    max_connections_per_shard: 64
    max_pending_requests_per_shard: 64
    max_concurrent_requests_per_endpoint: 128
    endpoints:
      - name: websocket-1
        address: websocket
        port: 8081
        weight: 1
  - name: grpc-upstream
    protocol: http2
    load_balancing_policy: round_robin
    connect_timeout_ms: 2000
    max_connections_per_shard: 1
    max_pending_requests_per_shard: 128
    max_http2_streams_per_connection: 64
    upstream_tls:
      server_name: upstream-grpc.example.test
      trust_bundle_secret: upstream-ca.pem
    endpoints:
      - name: grpc-upstream-1
        address: upstream-grpc.example.test
        port: 8443
        weight: 1

runtime_limits:
  max_downstream_connections_per_shard: 2048
  max_request_header_bytes: 32768
  max_request_body_bytes: 1048576
  max_upstream_response_header_bytes: 32768
  max_upstream_chunk_metadata_bytes: 32768
  request_timeout_ms: 5000
  downstream_idle_timeout_ms: 10000
