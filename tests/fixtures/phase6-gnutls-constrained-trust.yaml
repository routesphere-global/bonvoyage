server:
  node_id: phase6-gnutls-constrained-trust
  admin_addr: 0.0.0.0:9901
  metrics_addr: 0.0.0.0:9090
snapshot:
  schema_version: 1
  snapshot_id: phase6-gnutls-constrained-trust
  generation: 1
  minimum_dataplane_version: 0.2.0
listeners:
  - name: http
    address: 0.0.0.0
    port: 8080
    protocol: http1
    virtual_hosts: [constrained]
virtual_hosts:
  - name: constrained
    domains: [constrained.client.example.test]
    routes:
      - name: constrained
        match:
          path_prefix: /
        cluster: constrained
clusters:
  - name: constrained
    load_balancing_policy: round_robin
    connect_timeout_ms: 1000
    max_connections_per_shard: 2
    max_pending_requests_per_shard: 4
    upstream_tls:
      server_name: constrained.example.test
      trust_bundle_secret: constrained-ca.pem
    endpoints:
      - name: constrained-1
        address: constrained.example.test
        port: 8081
runtime_limits:
  max_downstream_connections_per_shard: 128
  max_request_header_bytes: 32768
  max_request_body_bytes: 1048576
  max_upstream_response_header_bytes: 32768
  max_upstream_chunk_metadata_bytes: 32768
  request_timeout_ms: 3000
  downstream_idle_timeout_ms: 5000
