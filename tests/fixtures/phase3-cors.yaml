server:
  node_id: cors-node
  admin_addr: 0.0.0.0:9901
  metrics_addr: 0.0.0.0:9090

snapshot:
  schema_version: 1
  snapshot_id: phase3-cors
  generation: 1
  minimum_dataplane_version: 0.2.0

listeners:
  - name: cors-http1
    address: 0.0.0.0
    port: 8080
    protocol: http1
    virtual_hosts: [api]
  - name: cors-http2
    address: 0.0.0.0
    port: 8443
    protocol: http2
    virtual_hosts: [api]
    downstream_tls:
      certificate_chain_secret: server-chain.pem
      private_key_secret: server-key.pem

virtual_hosts:
  - name: api
    domains: [api.example.test]
    routes:
      - name: cors-fixed
        match:
          path_exact: /cors/fixed
          methods: [GET]
        cors:
          allowed_origins:
            - https://app.example.com
            - http://localhost:3000
          allowed_methods: [GET]
          allowed_headers: [Authorization, Content-Type, X-Request-Id]
          exposed_headers: [X-Request-Id, X-Trace-Id]
          allow_credentials: true
          max_age_seconds: 600
        fixed_response:
          status_code: 200
          body: "cors fixed ready\n"
          content_type: text/plain
      - name: cors-upstream
        match:
          path_exact: /cors-observation
          methods: [GET, POST, DELETE]
        cors:
          allowed_origins: [https://app.example.com]
          allowed_methods: [GET, POST]
          allowed_headers: [Authorization, Content-Type, X-Request-Id]
          exposed_headers: [X-Request-Id, X-Trace-Id]
          allow_credentials: true
          max_age_seconds: 600
        cluster: upstream
      - name: cors-unavailable
        match:
          path_exact: /cors/unavailable
          methods: [GET]
        cors:
          allowed_origins: [https://app.example.com]
          allowed_methods: [GET]
          allow_credentials: true
        cluster: unavailable
      - name: cors-auth
        match:
          path_exact: /cors/auth
          methods: [GET]
        cors:
          allowed_origins: [https://app.example.com]
          allowed_methods: [GET]
          allowed_headers: [X-Request-Id]
          allow_credentials: true
          max_age_seconds: 60
        api_key_auth:
          credentials_secret: phase3-cors-api-keys.txt
        fixed_response:
          status_code: 200
          body: "authenticated\n"
          content_type: text/plain
      - name: cors-wildcard
        match:
          path_exact: /cors/wildcard
          methods: [GET]
        cors:
          allow_any_origin: true
          allowed_methods: [GET]
          max_age_seconds: 60
        fixed_response:
          status_code: 200
          body: "wildcard ready\n"
          content_type: text/plain
      - name: public
        match:
          path_exact: /public
        fixed_response:
          status_code: 200
          body: "public ready\n"
          content_type: text/plain

clusters:
  - name: unavailable
    load_balancing_policy: round_robin
    connect_timeout_ms: 100
    max_connections_per_shard: 1
    max_pending_requests_per_shard: 1
    endpoints:
      - name: closed-loopback-port
        address: 127.0.0.1
        port: 1
        weight: 1
  - name: upstream
    load_balancing_policy: round_robin
    connect_timeout_ms: 1000
    max_connections_per_shard: 16
    max_pending_requests_per_shard: 16
    endpoints:
      - name: upstream-1
        address: upstream
        port: 8081
        weight: 1

runtime_limits:
  max_downstream_connections_per_shard: 256
  max_request_header_bytes: 32768
  max_request_body_bytes: 1048576
  max_upstream_response_header_bytes: 32768
  max_upstream_chunk_metadata_bytes: 32768
  request_timeout_ms: 5000
  downstream_idle_timeout_ms: 5000
