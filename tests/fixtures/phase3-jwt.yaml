server:
  node_id: jwt-node
  admin_addr: 0.0.0.0:9901
  metrics_addr: 0.0.0.0:9090

snapshot:
  schema_version: 1
  snapshot_id: phase3-jwt
  generation: 1
  minimum_dataplane_version: 0.2.0

listeners:
  - name: jwt-http1
    address: 0.0.0.0
    port: 8080
    protocol: http1
    virtual_hosts: [api]
  - name: jwt-http2
    address: 0.0.0.0
    port: 8443
    protocol: http2
    virtual_hosts: [api]
    downstream_tls:
      certificate_chain_secret: server-chain.pem
      private_key_secret: server-key.pem

virtual_hosts:
  - name: api
    domains: [api.example.test]
    routes:
      - name: protected-upstream
        match:
          path_exact: /jwt-observation
        jwt_auth:
          jwks_secret: phase3-jwks.json
          issuer: https://issuer.example.test
          audience: payments-api
          required_type: at+jwt
          algorithms: [RS256]
          clock_skew_seconds: 5
          max_token_lifetime_seconds: 300
          required_scopes: [payments:read]
          required_claims:
            - name: tenant
              exact: tenant-a
          verification_rate_limit:
            capacity: 1000
            refill_tokens_per_second: 1000
        cluster: upstream
      - name: protected-fixed
        match:
          path_exact: /protected-fixed
        jwt_auth:
          jwks_secret: phase3-jwks.json
          issuer: https://issuer.example.test
          audience: payments-api
          required_type: at+jwt
          algorithms: [RS256]
          clock_skew_seconds: 5
          max_token_lifetime_seconds: 300
          required_scopes: [payments:read]
          required_claims:
            - name: tenant
              exact: tenant-a
          verification_rate_limit:
            capacity: 1000
            refill_tokens_per_second: 1000
        fixed_response:
          status_code: 200
          body: "protected ready\n"
          content_type: text/plain
      - name: verification-overload
        match:
          path_exact: /verification-overload
        jwt_auth:
          jwks_secret: phase3-jwks.json
          issuer: https://issuer.example.test
          audience: payments-api
          required_type: at+jwt
          algorithms: [RS256]
          clock_skew_seconds: 5
          max_token_lifetime_seconds: 300
          required_scopes: [payments:read]
          required_claims:
            - name: tenant
              exact: tenant-a
          verification_rate_limit:
            capacity: 2
            refill_tokens_per_second: 1
        fixed_response:
          status_code: 200
          body: "verification ready\n"
          content_type: text/plain
      - name: public
        match:
          path_exact: /public
        fixed_response:
          status_code: 200
          body: "public ready\n"
          content_type: text/plain

clusters:
  - name: upstream
    load_balancing_policy: round_robin
    connect_timeout_ms: 1000
    max_connections_per_shard: 16
    max_pending_requests_per_shard: 16
    endpoints:
      - name: upstream-1
        address: upstream
        port: 8081
        weight: 1

runtime_limits:
  max_downstream_connections_per_shard: 256
  max_request_header_bytes: 32768
  max_request_body_bytes: 1048576
  max_upstream_response_header_bytes: 32768
  max_upstream_chunk_metadata_bytes: 32768
  request_timeout_ms: 5000
  downstream_idle_timeout_ms: 5000
