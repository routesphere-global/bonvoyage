server:
  node_id: phase3-grpc-unary
  admin_addr: 0.0.0.0:9901
  metrics_addr: 0.0.0.0:9090

snapshot:
  schema_version: 1
  snapshot_id: phase3-grpc-unary
  generation: 1
  minimum_dataplane_version: 0.2.0

listeners:
  - name: tls-http2
    address: 0.0.0.0
    port: 8443
    protocol: http2
    virtual_hosts: [grpc-api]
    downstream_tls:
      certificate_chain_secret: server-chain.pem
      private_key_secret: server-key.pem

virtual_hosts:
  - name: grpc-api
    domains: [api.example.test]
    routes:
      - name: grpc-unary
        match:
          path_prefix: /bonvoyage.test.v1.Echo/
        cluster: grpc-upstream

clusters:
  - name: grpc-upstream
    protocol: http2
    load_balancing_policy: round_robin
    connect_timeout_ms: 2000
    max_connections_per_shard: 1
    max_pending_requests_per_shard: 64
    max_http2_streams_per_connection: 32
    upstream_tls:
      server_name: upstream-grpc.example.test
      trust_bundle_secret: upstream-ca.pem
    endpoints:
      - name: grpc-upstream-1
        address: upstream-grpc.example.test
        port: 8443

runtime_limits:
  max_downstream_connections_per_shard: 1024
  max_request_header_bytes: 32768
  max_request_body_bytes: 1048576
  max_upstream_response_header_bytes: 32768
  max_upstream_chunk_metadata_bytes: 32768
  request_timeout_ms: 3000
  downstream_idle_timeout_ms: 30000
