server:
  node_id: "oss-native-fresh-install"
  admin_addr: "127.0.0.1:9901"
  metrics_addr: "127.0.0.1:9090"

snapshot:
  schema_version: 1
  snapshot_id: "oss-native-fresh-install"
  generation: 1
  minimum_dataplane_version: "0.2.0"

listeners:
  - name: "http"
    address: "0.0.0.0"
    port: 8080
    protocol: "http1"
    virtual_hosts:
      - "default"

virtual_hosts:
  - name: "default"
    domains:
      - "*"
    routes:
      - name: "fixed-ready"
        match:
          path_exact: "/bonvoyage/ready"
        fixed_response:
          status_code: 200
          body: "ready\n"
          content_type: "text/plain"
      - name: "controlled-upstream"
        match:
          path_exact: "/healthz"
        cluster: "controlled-upstream"

clusters:
  - name: "controlled-upstream"
    load_balancing_policy: "round_robin"
    connect_timeout_ms: 1000
    max_connections_per_shard: 32
    max_pending_requests_per_shard: 64
    endpoints:
      - name: "loopback-upstream"
        address: "127.0.0.1"
        port: 18081
        weight: 1

runtime_limits:
  max_downstream_connections_per_shard: 1024
  max_request_header_bytes: 32768
  max_request_body_bytes: 1048576
  max_upstream_response_header_bytes: 32768
  max_upstream_chunk_metadata_bytes: 32768
  request_timeout_ms: 5000
  downstream_idle_timeout_ms: 15000
