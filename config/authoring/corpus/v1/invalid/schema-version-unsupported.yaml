server:
  node_id: corpus-schema-version
  admin_addr: 127.0.0.1:9901
  metrics_addr: 127.0.0.1:9090

snapshot:
  schema_version: 2
  snapshot_id: corpus-schema-version
  generation: 1
  minimum_dataplane_version: 0.2.0

listeners:
  - name: http
    address: 0.0.0.0
    port: 8080
    protocol: http1
    virtual_hosts: [default]

virtual_hosts:
  - name: default
    domains: ["*"]
    routes:
      - name: ready
        match:
          path_exact: /ready
        fixed_response:
          status_code: 200
          body: "ready\n"
          content_type: text/plain

clusters: []

runtime_limits:
  max_downstream_connections_per_shard: 128
  max_request_header_bytes: 32768
  max_request_body_bytes: 1048576
  max_upstream_response_header_bytes: 32768
  max_upstream_chunk_metadata_bytes: 32768
  request_timeout_ms: 5000
  downstream_idle_timeout_ms: 5000
