server:
  node_id: corpus-secret-literal
  admin_addr: 127.0.0.1:9901
  metrics_addr: 127.0.0.1:9090

snapshot:
  schema_version: 1
  snapshot_id: corpus-secret-literal
  generation: 1
  minimum_dataplane_version: 0.2.0

listeners:
  - name: https
    address: 0.0.0.0
    port: 8443
    protocol: http1
    virtual_hosts: [default]
    downstream_tls:
      certificate_chain_secret: server-chain.pem
      private_key_secret: "\u002d\u002d\u002d\u002d\u002d\u0042EGIN PRIVATE KEY\u002d\u002d\u002d\u002d\u002d\ncorpus-private-material-must-not-echo\n\u002d\u002d\u002d\u002d\u002d\u0045ND PRIVATE KEY\u002d\u002d\u002d\u002d\u002d"

virtual_hosts:
  - name: default
    domains: ["*"]
    routes:
      - name: ready
        match:
          path_exact: /ready
        fixed_response:
          status_code: 200
          body: "ready\n"
          content_type: text/plain
      - name: upstream
        match:
          path_prefix: /
        cluster: upstream

clusters:
  - name: upstream
    load_balancing_policy: round_robin
    connect_timeout_ms: 1000
    max_connections_per_shard: 16
    max_pending_requests_per_shard: 16
    endpoints:
      - name: upstream-1
        address: upstream
        port: 8081
        weight: 1

runtime_limits:
  max_downstream_connections_per_shard: 128
  max_request_header_bytes: 32768
  max_request_body_bytes: 1048576
  max_upstream_response_header_bytes: 32768
  max_upstream_chunk_metadata_bytes: 32768
  request_timeout_ms: 5000
  downstream_idle_timeout_ms: 5000
