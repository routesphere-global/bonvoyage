name: OSS Release Candidate Intake Foundation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oss-release-candidate-intake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Protected candidate intake preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    permissions:
      contents: read
    steps:
      - name: Check out the exact tagged commit without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
      - name: Install locked release-verifier dependencies
        run: npm ci --ignore-scripts
      - name: Verify the protected manual tag and powerless workflow contract
        run: >-
          node scripts/verify-oss-release-workflow.mjs
          --contract packaging/release/oss-release-identity-workflow-contract.json
          --workflow .github/workflows/release.yml
          --github-repository "$GITHUB_REPOSITORY"
          --github-ref-type "$GITHUB_REF_TYPE"
          --github-ref-name "$GITHUB_REF_NAME"
          --github-sha "$GITHUB_SHA"

  candidate-intake:
    name: Replay exact hosted candidate intake
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the exact tagged commit without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
      - name: Install locked release-verifier dependencies
        run: npm ci --ignore-scripts
      - name: Reverify the workflow before reading hosted evidence
        run: >-
          node scripts/verify-oss-release-workflow.mjs
          --contract packaging/release/oss-release-identity-workflow-contract.json
          --workflow .github/workflows/release.yml
          --github-repository "$GITHUB_REPOSITORY"
          --github-ref-type "$GITHUB_REF_TYPE"
          --github-ref-name "$GITHUB_REF_NAME"
          --github-sha "$GITHUB_SHA"
      - name: Discover exact prior candidate workflow runs
        id: candidate-runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/discover-oss-release-candidate-runs.mjs
          --repository "$GITHUB_REPOSITORY"
          --tag "$GITHUB_REF_NAME"
          --commit "$GITHUB_SHA"
          --current-run-id "$GITHUB_RUN_ID"
          --github-output "$GITHUB_OUTPUT"
      - name: Download Debian builder A evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: oss-deb-build-a
          path: ${{ runner.temp }}/release-candidate-input/debian/oss-deb-build-a
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.candidate-runs.outputs.deb_run_id }}
      - name: Download Debian builder B evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: oss-deb-build-b
          path: ${{ runner.temp }}/release-candidate-input/debian/oss-deb-build-b
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.candidate-runs.outputs.deb_run_id }}
      - name: Download Debian comparison evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: oss-deb-comparison
          path: ${{ runner.temp }}/release-candidate-input/debian/oss-deb-comparison
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.candidate-runs.outputs.deb_run_id }}
      - name: Download OCI builder A evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: oss-oci-build-a
          path: ${{ runner.temp }}/release-candidate-input/oci/oss-oci-build-a
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.candidate-runs.outputs.oci_run_id }}
      - name: Download OCI builder B evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: oss-oci-build-b
          path: ${{ runner.temp }}/release-candidate-input/oci/oss-oci-build-b
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.candidate-runs.outputs.oci_run_id }}
      - name: Download OCI comparison evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: oss-oci-comparison
          path: ${{ runner.temp }}/release-candidate-input/oci/oss-oci-comparison
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.candidate-runs.outputs.oci_run_id }}
      - name: Replay the fail-closed candidate intake
        run: >-
          node scripts/intake-oss-release-candidate.mjs
          --deb-root "$RUNNER_TEMP/release-candidate-input/debian"
          --oci-root "$RUNNER_TEMP/release-candidate-input/oci"
          --output "$RUNNER_TEMP/release-candidate-intake"
          --source-commit "$GITHUB_SHA"
          --source-tag "$GITHUB_REF_NAME"
          --deb-run-id "${{ steps.candidate-runs.outputs.deb_run_id }}"
          --oci-run-id "${{ steps.candidate-runs.outputs.oci_run_id }}"
          --created-at "${{ steps.candidate-runs.outputs.created_at }}"
      - name: Upload bounded non-publishing intake evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: oss-release-candidate-intake
          path: ${{ runner.temp }}/release-candidate-intake
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          retention-days: 3

  identity-probe:
    name: Verify keyless workflow identity
    needs: candidate-intake
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the exact tagged commit without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
      - name: Install locked release-verifier dependencies
        run: npm ci --ignore-scripts
      - name: Reverify the workflow before requesting an identity token
        run: >-
          node scripts/verify-oss-release-workflow.mjs
          --contract packaging/release/oss-release-identity-workflow-contract.json
          --workflow .github/workflows/release.yml
          --github-repository "$GITHUB_REPOSITORY"
          --github-ref-type "$GITHUB_REF_TYPE"
          --github-ref-name "$GITHUB_REF_NAME"
          --github-sha "$GITHUB_SHA"
      - name: Create the fixed non-release identity probe
        run: >-
          node scripts/create-oss-release-identity-probe.mjs
          --output "$RUNNER_TEMP/release-identity-probe/identity-probe.json"
          --repository "$GITHUB_REPOSITORY"
          --ref-type "$GITHUB_REF_TYPE"
          --tag "$GITHUB_REF_NAME"
          --commit "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Install the pinned keyless signing client
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.4
      - name: Sign and independently verify only the identity probe
        env:
          EXPECTED_IDENTITY: https://github.com/routesphere-global/bonvoyage/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}
          EXPECTED_ISSUER: https://token.actions.githubusercontent.com
        run: |
          cosign sign-blob --yes --oidc-provider github-actions --bundle \
            "$RUNNER_TEMP/release-identity-probe/identity-probe.sigstore.json" \
            "$RUNNER_TEMP/release-identity-probe/identity-probe.json"
          cosign verify-blob --bundle \
            "$RUNNER_TEMP/release-identity-probe/identity-probe.sigstore.json" \
            --certificate-identity "$EXPECTED_IDENTITY" \
            --certificate-oidc-issuer "$EXPECTED_ISSUER" \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            --certificate-github-workflow-ref "$GITHUB_REF" \
            --certificate-github-workflow-trigger "$GITHUB_EVENT_NAME" \
            "$RUNNER_TEMP/release-identity-probe/identity-probe.json" \
            > "$RUNNER_TEMP/release-identity-probe/verification.txt"
          cosign version --json \
            > "$RUNNER_TEMP/release-identity-probe/cosign-version.json"
          sha256sum \
            "$RUNNER_TEMP/release-identity-probe/identity-probe.json" \
            "$RUNNER_TEMP/release-identity-probe/identity-probe.sigstore.json" \
            "$RUNNER_TEMP/release-identity-probe/verification.txt" \
            "$RUNNER_TEMP/release-identity-probe/cosign-version.json" \
            > "$RUNNER_TEMP/release-identity-probe/sha256sums.txt"
      - name: Upload bounded non-publishing identity evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: oss-release-identity-probe
          path: ${{ runner.temp }}/release-identity-probe
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          retention-days: 3
