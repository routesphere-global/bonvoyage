name: Public CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  GOTOOLCHAIN: local

jobs:
  foundation:
    name: Foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Developer Certificate of Origin sign-offs
        if: github.event_name == 'pull_request'
        run: >-
          node scripts/verify-dco-signoffs.mjs
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.10
          cache: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
      - name: Install pinned public tooling without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run the portable public test surface
        run: make test
      - name: Install pinned documentation dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
        working-directory: docs-site
      - name: Build public documentation
        run: npm run build
        working-directory: docs-site
